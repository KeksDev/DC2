version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: dc2-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=dc2_secure_password
      - MONGO_INITDB_DATABASE=dc2_discord
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - dc2-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dc2-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:dc2_secure_password@mongodb:27017/dc2_discord?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-123456789
      - ENCRYPTION_KEY=your-32-character-encryption-key-here-12345
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,https://yourdomain.com
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - dc2-network
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dc2-frontend
    restart: unless-stopped
    environment:
      - API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    networks:
      - dc2-network

  # Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: dc2-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dc2-network

volumes:
  mongodb_data:

networks:
  dc2-network:
    driver: bridge